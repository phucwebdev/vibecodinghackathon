<!doctype html>
<html lang="vi">
<head>

  <meta name="theme-color" content="#2563EB">
  <!-- SỬA theo đề: mô tả + tiêu đề (tên app & menu lấy từ js/config.js) -->
  <meta name="description" content="Theo dõi sản phẩm, tồn kho và doanh thu của cửa hàng.">
  <title>Thẻ thành viên</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M8 13v10h16V13M7 9h18l-1 4H8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loyalty.css">
  <!-- Chuyển động dùng chung (tuyến tính) + giao diện riêng cho từng thiết bị -->

  <link rel="stylesheet" href="css/mobile.css" media="(max-width: 1023.98px)">
  <link rel="stylesheet" href="css/desktop.css" media="(min-width: 1024px)">
</head>
<body>

  <a href="#view" class="sr-only">Bỏ qua đến nội dung chính</a>

  <div class="app">
    <!-- Menu trái: máy tính (≥1024px). Link tự sinh từ CONFIG.menu -->
    <aside class="sidebar" aria-label="Thanh bên">
      <div class="sidebar-brand">
        <span class="brand-mark" data-brand-icon></span>
        <span data-app-name></span>
      </div>
      <nav class="sidebar-nav" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-user" id="sidebar-user"></div>
      <p class="sidebar-foot">Dữ liệu lưu trên máy này, dùng được khi mất mạng.</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="brand-mark" aria-hidden="true" data-brand-icon></span>
          <h1 id="page-title" data-app-name></h1>
        </div>
        <div class="topbar-right">
          <div class="role-switch segmented has-thumb" role="group" aria-label="Chọn chế độ" id="role-switch">
            <button type="button" class="segment" data-role="member">Thành viên</button>
            <button type="button" class="segment" data-role="counter">Quầy</button>
          </div>
        </div>
      </header>

      <main id="view" class="content" tabindex="-1"></main>
    </div>

    <!-- Thanh tab đáy: điện thoại & tablet (<1024px). Link tự sinh từ CONFIG.menu -->
    <nav class="tabbar" aria-label="Điều hướng chính"></nav>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript><p style="padding:24px">Vui lòng bật JavaScript để sử dụng ứng dụng.</p></noscript>

  <!-- Thư viện QR đặt sẵn trong vendor/ để chạy được khi mất mạng -->
  <script src="vendor/qrcode.js" defer></script>
  <script src="vendor/jsQR.js" defer></script>
  <script src="vendor/xlsx.mini.min.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="data/seed.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
